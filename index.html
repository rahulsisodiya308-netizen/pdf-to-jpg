<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF to JPG Converter</title>

  <link rel="stylesheet" href="./style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>PDF to JPG Converter</h1>
      <p class="subtitle">
        Convert PDF pages to high-quality JPG images online for free.
      </p>
    </div>

    <div class="drop-zone" id="dropZone">

      <div class="upload-icon">📄</div>

      <h2>Upload your PDF</h2>

      <p>Select a PDF file from your device</p>

      <input
        type="file"
        id="pdfInput"
        accept=".pdf,application/pdf"
      >

      <p id="fileName"></p>

    </div>

    <div class="controls">

      <label for="pageMode">Pages</label>

      <select id="pageMode">
        <option value="all">All Pages</option>
        <option value="selected">Selected Pages</option>
        <option value="range">Page Range</option>
      </select>

      <input
        type="text"
        id="pageInput"
        placeholder="Example: 1,3,5 or 2-6"
        style="display:none;"
      >

      <label for="quality">Quality</label>

      <select id="quality">
        <option value="1.5">Standard</option>
        <option value="2" selected>High</option>
        <option value="3">Maximum</option>
      </select>

      <button id="convertBtn" disabled>
        Convert to JPG
      </button>

    </div>

    <div id="progress"></div>

    <div id="results"></div>

  </div>

  <script src="./script.js"></script>

</body>
</html>
