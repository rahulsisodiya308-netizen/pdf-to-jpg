
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PDF to JPG Converter - Free Online</title>

  <meta
    name="description"
    content="Convert PDF pages to high-quality JPG images online for free. Fast, secure and easy to use."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>PDF to JPG Converter</h1>
      <p class="subtitle">
        Convert PDF pages to high-quality JPG images online for free.
      </p>
    </div>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="pdfInput" accept="application/pdf">

      <div class="upload-icon">📄</div>

      <h2>Upload your PDF</h2>

      <p>
        Click here or drag and drop your PDF file
      </p>

      <p id="fileName"></p>
    </div>

    <div class="controls">

      <label for="pageMode">Pages</label>

      <select id="pageMode">
        <option value="all">All Pages</option>
        <option value="selected">Selected Pages</option>
        <option value="range">Page Range</option>
      </select>

      <input
        type="text"
        id="pageInput"
        placeholder="Example: 1,3,5 or 2-6"
        style="display:none;"
      >

      <label for="quality">Quality</label>

      <select id="quality">
        <option value="1.5">Standard</option>
        <option value="2" selected>High</option>
        <option value="3">Maximum</option>
      </select>

      <button id="convertBtn" disabled>
        Convert to JPG
      </button>

    </div>

    <div id="progress"></div>

    <div id="results"></div>

  </div>

  <script type="module" src="./script.js"></script>

</body>
</html>
